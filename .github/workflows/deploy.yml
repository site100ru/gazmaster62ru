name: Deploy gazmaster62ru

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.REGRU_HOST }}
          username: ${{ secrets.REGRU_USER }}
          key: ${{ secrets.REGRU_KEY }}
          script: |
            cd /var/www/u1538455/data/www/gazmaster62.ru/wp-content/themes/gazmaster62ru
            git clone git@github.com:site100ru/gazmaster62ru.git .
            
            #cd /var/www/u1538455/data/www/gazmaster62.ru/wp-content/themes/gazmaster62ru
            #git pull
